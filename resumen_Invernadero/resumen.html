<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GreenHome - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina_registro">

    <header class="navbar navbar-dark bg-success barramagica">
        <div class="container-fluid">

            <a class="navbar-brand" href="..index.html">GreenHome</a>

            <button class="navbarr-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menudesplegable" aria-controls="menudesplegable" aria-expanded="false" id="menuhamburgesa" aria-label="Abrir menu desplegable">
                <span class="navbar-toggler-icon"></span>
            </button>

         <div div class="collapse navbar-collapse justify-content-end" id="menudesplegable">
            <ul class="navbar-nav">
                <li class="nav-item"> Ayuda </li>
                <li class="nav-item"> Contacto</li>
                <li class="nav-item"> <a href="../login.HTML">Cerrar Sesión</a></li>  
            </ul>
         </div>

        </div>

    </header>

    <main class="container my-4">

        <h2> Resumen del invernadero</h2>
        
        <div class="row g-3 mb-4">

         <div class="row g-3 mb-4">
            <div class="col-6 col-md">
                <div class="card border-o shadow-sm text-center p-3 h-100">
                    <div class=""text-muted small mb-1>
                        <i class="bi bi-clock-fill text-primary me-1"></i>Hora actual
                    </div>
                    <h4 class="fw-fold text-dark my-auto" id="reloj">00:00:00</h4>
                </div>
            </div>
            </div>

         <div class="col-6 col-md">
            <div class="card border-0 shadow-sm text-center p-3 h-100">
                <div class="text-muted small mb-1">
                    <i class="bi bi-thermometer-half text-danger me-1"></i>Temperatura
                 </div>

                 <h4 class="fw-bold text-danger my-auto">
                    <span id="temperatura">22.5</span> °C
                </h4>
            </div>
         </div>

         <div class="col-6 col-md">
            <div class="card border-0 shadow-sm text-center p-3 h-100">
                <div class="text-muted small mb-1">
                    <i class="bi bi-droplet-fill text-info me-1"></i>Humedad
                </div>
                <h4 class="fw-bold text-info my-auto">
                    <span id="humedad">58</span>%
                </h4>
            </div>
         </div>

         <div class="col-6 col-md">
            <div class="card border-0 shadow-sm text-center p-3 h-100">
                <div class="text-muted small mb-1">
                    <i class="bi bi-cpu-fill text-secondary me-1"></i>Total Sensores
                </div>
                <h4 class="fw-bold text-secondary my-auto" id="sensores">0</h4>
            </div>
         </div>

         <div class="col-6 col-md">
            <div class="card border-0 shadow-sm text-center p-3 h-100">
                <div class="text-muted small mb-1">
                    <i class="bi bi-flower2 text-success me-1"></i>Total Plantas
                </div>
                <h4 class="fw-bold text-success my-auto" id="total-plantas">0</h4>
            </div>
         </div>

        </div>
        
        <div class="mb-3">
            <input type="buscar" id="busqueda" class="form-control" placeholder="buscar planta">
        </div>

        <form id="registro" class="row g-2 mb-4">
            <div>
                <input type="text" id="inputsensor" placeholder="añada sensor" required>
                <input type="text" id="inputplanta" placeholder="añada planta" required>
                <button type="submit" class="btn btn-success">Añadir</button>
            </div>

        </form>
        <div class="card border-0 shadow-sm p-3 mb-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Sensor</th>
                        <th>Planta</th>
                        <th>Fecha de Registro</th>
                        <th class="text-end">Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                </tbody>
            </table>
        </div>
</div>
        

    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src= "resumen.js"></script>
</body>
</html>
