<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GreenHome - Resumen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <script src="resumen.js"></script>
</head>
<body x-data="gestionInvernadero">

    <header class="navbar navbar-dark bg-success barramagica">
        <div class="container-fluid">

            <a class="navbar-brand" href="../index.html">GreenHome</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menudesplegable" aria-controls="menudesplegable" aria-expanded="false" id="menuhamburgesa" aria-label="Abrir menu desplegable">
                <span class="navbar-toggler-icon"></span>
            </button>

         <div div class="collapse navbar-collapse justify-content-end" id="menudesplegable">
            <ul class="navbar-nav">
                <li class="nav-item"> Ayuda </li>
                <li class="nav-item"> Contacto</li>
                <li class="nav-item"> <a href="../login/login.HTML">Cerrar Sesión</a></li>  
            </ul>
         </div>

        </div>

    </header>

    <main class="container my-4">

        <h2> Resumen del invernadero</h2>
        
        <div class="row g-3 mb-4">

         <div class="row g-3 mb-4">
            <div class="col-6 col-md">
                <div class="card border-o shadow-sm text-center p-3 h-100">
                    <div class="text-muted small mb-1">
                        <i class="bi bi-clock-fill text-primary me-1"></i>Hora actual
                    </div>
                    <h4 class="fw-fold text-dark my-auto" id="reloj">00:00:00</h4>
                </div>
            </div>
            </div>
         <div class="col-6 col-md">
            <div class="card border-0 shadow-sm text-center p-3 h-100">
                <div class="text-muted small mb-1">
                    <i class="bi bi-thermometer-half text-danger me-1"></i>Temperatura
                 </div>

                 <h4 class="fw-bold text-danger my-auto">
                    <span id="temperatura">22.5</span> °C
                </h4>
            </div>
         </div>
         <div class="col-6 col-md">
            <div class="card border-0 shadow-sm text-center p-3 h-100">
                <div class="text-muted small mb-1">
                    <i class="bi bi-droplet-fill text-info me-1"></i>Humedad
                </div>
                <h4 class="fw-bold text-info my-auto">
                    <span id="humedad">58</span>%
                </h4>
            </div>
         </div>
         <div class="col-6 col-md">
            <div class="card border-0 shadow-sm text-center p-3 h-100">
                <div class="text-muted small mb-1">
                    <i class="bi bi-cpu-fill text-secondary me-1"></i>Total Sensores
                </div>
                <h4 class="fw-bold text-secondary my-auto" x-text="plantas.length">0</h4>
            </div>
         </div>
         <div class="col-6 col-md">
            <div class="card border-0 shadow-sm text-center p-3 h-100">
                <div class="text-muted small mb-1">
                    <i class="bi bi-flower2 text-success me-1"></i>Total Plantas
                </div>
                <h4 class="fw-bold text-success my-auto" x-text="plantas.length">0</h4>
            </div>
         </div>

        </div>
        <div class="mb-3">
            <input type="buscar" x-model="busqueda" class="form-control" placeholder="buscar planta">
        </div>
        <form @submit.prevent="agregarRegistro" class="row g-2 mb-4">
             <div class="col-md-5">
                <input type="text" x-model="nuevoSensor" class="form-control" placeholder="Añada sensor" required>
            </div>
            <div class="col-md-5">
                <input type="text" x-model="nuevaPlanta" class="form-control" placeholder="Añada planta" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">Añadir</button>
            </div>
        </form>
        <div class="card border-0 shadow-sm p-3 mb-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>N°</th>
                        <th>Sensor</th>
                        <th>Planta</th>
                        <th>Fecha de Registro</th>
                        <th class="text-end">Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                    <template x-for="(item, index) in filtrar" :key="item.id || index">
                        <tr>
                            <td x-text="index + 1"></td>
                            <td x-text="item.sensor"></td>
                            <td x-text="item.planta"></td>
                            <td x-text="item.fecha || 'N/A'"></td>
                            <td class="text-end">
                                 <button @click="eliminar(item.id)" class="btn btn-outline-danger btn-sm">Eliminar</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
        
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
