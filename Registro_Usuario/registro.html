<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GreenHome - Registro de usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina_registro_usuario">
    <header class="navbar navbar-dark bg-success barramagica">
        <div class="container-fluid">
            <a class="navbar-brand" href="../Pagina_Inicio/index.html">GreenHome</a>
            <button class="navbarr-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menudesplegable" aria-controls="menudesplegable" aria-expanded="false" id="menuhamburgesa" aria-label="Abrir menu desplegable">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="menudesplegable">
                <ul class="navbar-nav">
                    <li class="nav-item"> Ayuda </li>
                    <li class="nav-item"> Contacto</li>
                    <li class="nav-item"> <a href="../login/login.html">Iniciar Sesión</a></li>
                    <li class="nav-item"> <a href="../Registro_Usuario/registro.html">Registrarme</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="d-flex justify-content-center align-items-center min-vh-100">
        <section id="tarjeta" class="card p-4 shadow-lg" style="max-width: 400px; width: 100%;">
            <h2 class="card-title text-center mb-4">Crear cuenta</h2>

            <form class="formulario_registro" novalidate>
                <div class="mb-3 text-start">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input type="text" class="form-control" id="nombre" required>
                </div>

                <div class="mb-3 text-start">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" required>
                    <div class="form-text text-danger d-none" id="errorCorreo"></div>
                </div>

                <div class="mb-3 text-start">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" required>
                </div>

                <div class="mb-3 text-start">
                    <label for="confirmarContrasena" class="form-label">Confirmar contraseña</label>
                    <input type="password" class="form-control" id="confirmarContrasena" required>
                    <div class="form-text text-danger d-none" id="errorContrasena"></div>
                </div>

                <button type="submit" class="btn btn-success w-100" id="botonRegistrar">Registrarme</button>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="registro.js"></script>
</body>
</html>
