<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GreenHome - Inicio de sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina_inicio_sesion">
    <header class="navbar navbar-dark bg-success barramagica">
        <div class="container-fluid">

        <a class="navbar-brand" href="../index.html">GreenHome</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menudesplegable" aria-controls="menudesplegable" aria-expanded="false" id="menuhamburgesa" aria-label="Abrir menu desplegable">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="menudesplegable">
        <ul class="navbar-nav">
            <li class="nav-item"> Ayuda </li>
            <li class="nav-item"> Contacto</li>
            <li class="nav-item"> <a href="../login/login.html">Iniciar Sesión</a></li>
            <li class="nav-item"> <a href="../Registro_Usuario/registro.html">Registrarme</a></li>
        </ul> 
         </div>

        </div>
    </header>

    <main class="d-flex justify-content-center align-items-center min-vh-100">
        <section id="tarjeta" class="card p-4 shadow-lg" style="max-width: 400px; width: 100%;" x-data="loginApp()">
            <h2 class="card-title text-center mb-4">Inicio de sesión</h2>

            <form class="iniciodesesion" @submit.prevent="iniciarSesion()" novalidate>
                <div class="mb-3 text-start">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" :class="{ 'is-invalid': errorCorreo }"
                        id="correo" x-model="correo" required>
                    <div class="form-text text-danger" x-cloak x-show="errorCorreo" x-text="errorCorreo"></div>
                </div>

                <div class="mb-3 text-start">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" :class="{ 'is-invalid': errorContrasena }"
                        id="contrasena" x-model="contrasena" required>
                    <div class="form-text text-danger" x-cloak x-show="errorContrasena" x-text="errorContrasena"></div>
                </div>

                <div class="alert alert-danger py-2" x-cloak x-show="errorGeneral" x-text="errorGeneral"></div>
                <div class="alert alert-success py-2" x-cloak x-show="exito" x-text="exito"></div>

                <button type="submit" class="btn btn-success w-100" :disabled="cargando || !!exito">
                    <span x-text="cargando ? 'Cargando...' : 'Siguiente'"></span>
                </button>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src= "login.js"></script>
</body>
</html>
